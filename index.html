<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    // Dynamic base for SPA routing: /valentin/ on GitHub Pages, / on local dev
    (function() {
      var b = document.createElement('base');
      b.href = location.pathname.indexOf('/valentin') === 0 ? '/valentin/' : '/';
      document.head.appendChild(b);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>valentin barrio</title>
  <meta name="description" content="valentin barrio — photography portfolio">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Viewer -->
  <div id="viewer">
    <div id="strip"></div>
  </div>

  <!-- Footer -->
  <footer id="footer">
    <!-- Home mode -->
    <div id="footer-home">
      <div class="footer__left" id="footer-about">valentín<span class="about-surname"> barrio</span></div>
      <div class="footer__center" id="footer-project-name"></div>
      <div class="footer__right" id="footer-switch"><svg class="switch-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#fff" stroke="none"/></svg></div>
    </div>
    <!-- Project mode -->
    <div id="footer-project">
      <div class="footer__marquee">
        <div class="footer__marquee-inner" id="marquee-text"></div>
      </div>
      <div class="footer__arrow" id="btn-back"><svg viewBox="0 0 12 18"><polygon points="12,0 0,9 12,18"/></svg></div>
      <div class="footer__arrow" id="btn-next"><svg viewBox="0 0 12 18"><polygon points="0,0 12,9 0,18"/></svg></div>
    </div>
    <!-- Lengüeta: project browser menu -->
    <div id="lengueta" class="lengueta">
      <div class="lengueta__content" id="lengueta-content"></div>
    </div>
  </footer>

  <!-- 8x8 Grid Transition overlay -->
  <div id="grid-transition"></div>

  <script src="./js/utils.js"></script>
  <script src="./js/footer.js"></script>
  <script src="./js/audio-player.js"></script>
  <script src="./js/home.js"></script>
  <script src="./js/project.js"></script>
  <script src="./js/transitions.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
