<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // Clean URL routing for static hosting (GitHub Pages, etc.)
    // Detects base path dynamically from URL structure
    const segments = window.location.pathname.split('/');
    const routeIdx = segments.indexOf('project') !== -1
      ? segments.indexOf('project')
      : segments.indexOf('about') !== -1
        ? segments.indexOf('about')
        : -1;
    const base = routeIdx > 0
      ? '/' + segments.slice(1, routeIdx).join('/') + '/'
      : '/';
    const path = window.location.pathname;
    const route = path.startsWith(base) ? '/' + path.slice(base.length) : path;
    sessionStorage.setItem('route', route);
    window.location.replace(base);
  </script>
</head>
<body></body>
</html>
